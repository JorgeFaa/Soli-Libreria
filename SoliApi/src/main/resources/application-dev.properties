# Configuración para desarrollo local - SIN AWS Cognito

# Base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca_db
spring.datasource.username=bibliotecario
spring.datasource.password=biblioteca123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# AWS - Valores dummy para desarrollo (no funcionales)
aws.accessKeyId=dummy-key
aws.secretAccessKey=dummy-secret

# Cognito - Valores dummy para desarrollo (no funcionales)
spring.security.oauth2.client.registration.cognito.region=us-east-1
spring.security.oauth2.client.registration.cognito.userPoolId=dummy-pool
spring.security.oauth2.client.registration.cognito.client-id=dummy-client
spring.security.oauth2.client.registration.cognito.client-secret=dummy-secret
spring.security.oauth2.client.registration.cognito.scope=openid,email,phone
spring.security.oauth2.client.registration.cognito.redirect-uri=http://localhost:3000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://dummy-jwk-uri

spring.security.oauth2.client.provider.cognito.issuer-uri=http://dummy-issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://dummy-issuer
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# JWT local para pruebas
jwt.secret=E3zYWBhYkzVcJjU/c7QQ1BVKqTRkXRqJVlgHaxtwqyY=

# JPA/Hibernate configuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# Configuración para evitar problemas con JWT/Cognito en desarrollo
spring.security.oauth2.resourceserver.jwt.enabled=false

# Puerto del servidor
server.port=8080