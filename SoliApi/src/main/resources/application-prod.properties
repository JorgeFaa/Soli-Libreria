# =====================================================
# CONFIGURACIÓN DE PRODUCCIÓN - API SOLI V1 & V2
# =====================================================

# Base de datos en producción
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate para producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones optimizado para producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# AWS Configuration
aws.accessKeyId=${MY_AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${MY_AWS_SECRET_ACCESS_KEY}

# Cognito OAuth2 Configuration
spring.security.oauth2.client.registration.cognito.region=${COGNITO_REGION}
spring.security.oauth2.client.registration.cognito.userPoolId=${COGNITO_USER_POOL_ID}
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=openid,email,phone
spring.security.oauth2.client.registration.cognito.redirect-uri=${FRONTEND_URL:https://d84l1y8p4kdic.cloudfront.net}

# JWT Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_lTSWlzRlA
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_lTSWlzRlA
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# JWT Secret
jwt.secret=${JWT_SECRET:E3zYWBhYkzVcJjU/c7QQ1BVKqTRkXRqJVlgHaxtwqyY=}

# Server configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Logging para producción
logging.level.com.soli.api=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=INFO

# Actuator para monitoreo (solo endpoints necesarios)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# CORS para producción
cors.allowed-origins=${FRONTEND_URL:https://d84l1y8p4kdic.cloudfront.net}