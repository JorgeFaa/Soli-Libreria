<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soli API • Referencia (Scalar)</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      #reference { height: 100%; }
      .notice { position: absolute; top: 8px; right: 12px; font-size: 12px; opacity: 0.7; z-index: 10; }
    </style>
  </head>
  <body>
    <div class="notice">Para probar endpoints protegidos, haz clic en Authorize y pega tu Bearer token.</div>
    <div id="reference">
      <api-reference
        spec-url="/api/v1/v3/api-docs"
        configuration='{"layout":"classic","theme":"default","hideDownloadButton":false,"showSidebar":true,"servers":[{"url":"/api/v1"}]}'
        style="display:block; height:100%"
      ></api-reference>
    </div>
    <script type="module">
      // Define the web component by importing the module
      import 'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
    </script>
    <noscript>Habilita JavaScript para ver la documentación.</noscript>
  </body>
</html>
