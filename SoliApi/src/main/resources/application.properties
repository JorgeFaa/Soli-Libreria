# =============================================
# CONFIGURATION FOR PUBLIC IP + SSL (Spring Boot native)
# =============================================

# 1. Database (Public IP)
spring.datasource.url=jdbc:postgresql://${DB_URL}:5432/Soli_DB
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 2. SSL Properties (The Spring Boot Way)
spring.datasource.ssl.mode=verify-ca
spring.datasource.ssl.root-certificate=classpath:server-ca.pem
spring.datasource.ssl.certificate=classpath:client-cert.pem
spring.datasource.ssl.key=classpath:client-key.p8

# 3. JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. AWS Cognito
aws.accessKeyId=${MY_AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${MY_AWS_SECRET_ACCESS_KEY}

# 5. Spring Security / OAuth2 / JWT
spring.security.oauth2.client.registration.cognito.region=${COGNITO_REGION}
spring.security.oauth2.client.registration.cognito.userPoolId=${COGNITO_USER_POOL_ID}
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=openid,email,phone
spring.security.oauth2.client.registration.cognito.redirect-uri=${FRONTEND_URL:https://d84l1y8p4kdic.cloudfront.net}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_lTSWlzRlA
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_lTSWlzRlA
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# 6. Server
server.port=${PORT:8080}

# 7. Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# 8. Hikari Connection Pool
spring.datasource.hikari.connection-timeout=30000
